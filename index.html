<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲中心 - 歡樂遊戲大集合</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', '微軟正黑體', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .game-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .game-icon {
            font-size: 80px;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-info {
            padding: 20px;
        }

        .game-info h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .game-info p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .game-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .game-link:hover {
            background: #764ba2;
        }

        .features {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .features h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .features-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .feature-item {
            padding: 15px;
            border-left: 4px solid #667eea;
        }

        .feature-item h3 {
            color: #667eea;
            margin-bottom: 8px;
        }

        .feature-item p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 遊戲中心</h1>
            <p>選擇你喜歡的遊戲，開始你的冒險吧！</p>
        </header>

        <div class="games-grid">
            <!-- 公雞找谷粒遊戲 -->
            <div class="game-card">
                <div class="game-icon">🐓</div>
                <div class="game-info">
                    <h2>公雞找谷粒</h2>
                    <p>幫助可愛的公雞找到所有的谷粒，但要小心別被妖怪抓到！</p>
                    <a href="pacman_game.html" class="game-link">開始遊戲</a>
                </div>
            </div>

            <!-- 約時間查詢 -->
            <div class="game-card">
                <div class="game-icon">⏰</div>
                <div class="game-info">
                    <h2>約時間查詢</h2>
                    <p>快速查詢什麼時候大家都有時間，輕鬆安排聚會！</p>
                    <a href="when_to_meet.html" class="game-link">立即使用</a>
                </div>
            </div>
        </div>

        <div class="features">
            <h2>✨ 遊戲特色</h2>
            <div class="features-list">
                <div class="feature-item">
                    <h3>🎯 多難度選擇</h3>
                    <p>從簡單到困難，還能自訂遊戲參數，挑戰自己的極限</p>
                </div>
                <div class="feature-item">
                    <h3>📱 跨平台支持</h3>
                    <p>電腦、平板、手機都能玩，隨時隨地享受遊戲樂趣</p>
                </div>
                <div class="feature-item">
                    <h3>🌟 免費開放</h3>
                    <p>完全免費，無廣告，無下載，直接在瀏覽器中玩</p>
                </div>
                <div class="feature-item">
                    <h3>💯 趣味十足</h3>
                    <p>可愛的角色、流暢的遊戲體驗、讓你欲罷不能</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
