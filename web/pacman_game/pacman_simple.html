<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單 Pac-Man 遊戲</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #333;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        #gameContainer {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            color: #333;
            margin: 0 0 10px 0;
        }

        #info {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        /* 遊戲區域 */
        #gameBoard {
            display: inline-grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            background: #000;
            padding: 10px;
            margin: 20px 0;
            border-radius: 5px;
        }

        /* 遊戲格子 */
        .cell {
            width: 30px;
            height: 30px;
            background: #222;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .controls {
            color: #666;
            font-size: 14px;
            margin: 10px 0;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #45a049;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            height: 30px;
        }

        .lose {
            color: red;
        }

        .win {
            color: green;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🎮 簡單 Pac-Man</h1>
        <div id="info">分數: <span id="score">0</span></div>
        <div id="gameBoard"></div>
        <div class="controls">
            👆 用方向鍵移動黃色點點<br>
            🔵 吃掉所有藍點<br>
            👻 避開紅色幽靈
        </div>
        <button onclick="location.reload()">重新開始</button>
        <div id="message"></div>
    </div>

    <script>
        // ===== 遊戲設定 =====
        const ROWS = 5;           // 5 列
        const COLS = 10;          // 10 行
        const TOTAL_CELLS = ROWS * COLS;

        // ===== 遊戲變數 =====
        let pacmanPos = 0;         // Pac-Man 位置（0-49）
        let ghostPos = TOTAL_CELLS - 1;  // 幽靈位置
        let blueDots = [];         // 藍點的位置陣列
        let score = 0;             // 分數
        let gameOver = false;      // 遊戲是否結束
        let gameWin = false;       // 遊戲是否獲勝

        // ===== 初始化遊戲 =====
        function initGame() {
            // 清空藍點
            blueDots = [];
            // 在所有格子中放藍點（除了 Pac-Man 和幽靈的位置）
            for (let i = 0; i < TOTAL_CELLS; i++) {
                if (i !== pacmanPos && i !== ghostPos) {
                    blueDots.push(i);
                }
            }
            drawBoard();
        }

        // ===== 繪製遊戲棋盤 =====
        function drawBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';  // 清空棋盤

            // 逐個建立格子
            for (let i = 0; i < TOTAL_CELLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';

                // 判斷這個格子顯示什麼
                if (i === pacmanPos) {
                    cell.textContent = '🟡';  // Pac-Man
                } else if (i === ghostPos) {
                    cell.textContent = '👻';  // 幽靈
                } else if (blueDots.includes(i)) {
                    cell.textContent = '🔵';  // 藍點
                }

                board.appendChild(cell);
            }
        }

        // ===== Pac-Man 移動 =====
        function movePacman(direction) {
            if (gameOver || gameWin) return;  // 遊戲結束就不能動

            let newPos = pacmanPos;

            // 根據方向計算新位置
            if (direction === 'up' && pacmanPos >= COLS) {
                newPos = pacmanPos - COLS;
            } else if (direction === 'down' && pacmanPos < TOTAL_CELLS - COLS) {
                newPos = pacmanPos + COLS;
            } else if (direction === 'left' && pacmanPos % COLS !== 0) {
                newPos = pacmanPos - 1;
            } else if (direction === 'right' && pacmanPos % COLS !== COLS - 1) {
                newPos = pacmanPos + 1;
            }

            pacmanPos = newPos;

            // 檢查有沒有吃到藍點
            if (blueDots.includes(pacmanPos)) {
                blueDots = blueDots.filter(pos => pos !== pacmanPos);
                score += 10;
                document.getElementById('score').textContent = score;
            }

            // 檢查有沒有吃完所有藍點（獲勝）
            if (blueDots.length === 0) {
                gameWin = true;
                document.getElementById('message').textContent = '🎉 恭喜！你贏了！';
                document.getElementById('message').className = 'win';
            }

            drawBoard();
            moveGhost();
            checkCollision();
        }

        // ===== 幽靈移動 =====
        function moveGhost() {
            // 隨機選擇 4 個方向
            const directions = [-COLS, COLS, -1, 1];
            let validMoves = [];

            // 找出所有可以移動的方向
            directions.forEach(dir => {
                let newPos = ghostPos + dir;
                // 檢查是否超出棋盤邊界
                if (newPos >= 0 && newPos < TOTAL_CELLS) {
                    // 上下移動時的邊界檢查
                    if (dir === -COLS || dir === COLS) {
                        validMoves.push(newPos);
                    }
                    // 左右移動時的邊界檢查
                    else if (dir === -1 && ghostPos % COLS !== 0) {
                        validMoves.push(newPos);
                    } else if (dir === 1 && ghostPos % COLS !== COLS - 1) {
                        validMoves.push(newPos);
                    }
                }
            });

            // 從可以移動的方向中隨機選一個
            if (validMoves.length > 0) {
                ghostPos = validMoves[Math.floor(Math.random() * validMoves.length)];
            }
        }

        // ===== 檢查碰撞 =====
        function checkCollision() {
            if (pacmanPos === ghostPos) {
                gameOver = true;
                document.getElementById('message').textContent = '💀 遊戲結束！被幽靈抓到了';
                document.getElementById('message').className = 'lose';
            }
        }

        // ===== 鍵盤控制 =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                movePacman('up');
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                movePacman('down');
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                movePacman('left');
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                movePacman('right');
                e.preventDefault();
            }
        });

        // ===== 自動移動幽靈 =====
        setInterval(() => {
            if (!gameOver && !gameWin) {
                moveGhost();
                checkCollision();
                drawBoard();
            }
        }, 1000);

        // ===== 開始遊戲 =====
        initGame();
    </script>
</body>
</html>
